name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1:
    name: Schemas, fixtures, smoke and fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the committed bundle
        run: node test/validate.mjs
      - name: Check deterministic generation and invalid bundles
        run: node --test test/fixtures.test.mjs
      - name: Run unchanged smoke and fuzz against local Wrangler
        run: node test/run-local.mjs
